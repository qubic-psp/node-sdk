# Stages the package on npmjs.com when a tag v<version> is pushed on a commit of main; a maintainer approves it with 2FA.
#
# build   — no secrets: install, all checks, `npm pack`; the tarball goes on as an artifact.
# publish — the GitHub environment `npm` (protection rules: required reviewer, tags v* only) holds the secret
#           NPM_TOKEN (stage-only); it installs only the pinned npm CLI and runs no package scripts: `npm stage publish <tarball>`.
# Provenance is added for a public repository only (npm refuses it for private ones). After the first publish the
# token can be replaced by npm trusted publishing (OIDC) for this workflow.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag is on main and equals the version of package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: yarn install --frozen-lockfile
      - run: yarn ci
      # npm pack does not create the destination folder
      - run: mkdir -p dist-pack && npm pack --pack-destination dist-pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: dist-pack/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Staged publishing (npm 11.15+; Node 22 ships npm 10): the version waits in the staged queue of npmjs.com until a
      # maintainer approves it with 2FA — the Staged Packages page or `npm stage approve <id>`. NPM_TOKEN is a stage-only
      # granular token: npm refuses a direct publish with it, so a leaked token cannot release anything by itself.
      - name: npm with staged publishing
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Stage
        run: npm stage publish ./*.tgz --access public --ignore-scripts ${{ github.event.repository.private == false && '--provenance' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
